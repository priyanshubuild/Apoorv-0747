name: Generate Apoorv's contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Render light and dark contribution trails
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Apoorv-0747
          outputs: |
            dist/github-snake.svg?color_snake=#0891b2&color_dots=#f1f5f9,#c9e9ed,#8ad5d9,#37b6c2,#0e7490
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#67e8f9&color_dots=#0d1117,#14323d,#17606e,#239caf,#67e8f9

      - name: Publish SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
