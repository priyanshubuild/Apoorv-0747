<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.name{animation:enter .9s both}.sub{animation:enter .9s .15s both}.line{animation:enter .9s .3s both}.phrase{opacity:0;animation:show 12s infinite}.p2{animation-delay:4s}.p3{animation-delay:8s}.cursor{animation:blink 1s steps(1,end) infinite}.node{animation:pulse 3s ease-in-out infinite}.n2{animation-delay:1s}.n3{animation-delay:2s}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes show{0%,3%{opacity:0}7%,29%{opacity:1}33%,100%{opacity:0}}@keyframes blink{50%{opacity:0}}@keyframes pulse{50%{opacity:.25}}@media(prefers-reduced-motion:reduce){.name,.sub,.line,.cursor,.node{animation:none}.phrase{animation:none;opacity:0}.p1{opacity:1}}</style>
